name: Build and qualify the image
description: >-
  Run the fast gate and the integration class, build the image, annotate it
  into an OCI layout, and qualify that exact layout.

outputs:
  digest:
    description: Manifest digest of the qualified image
    value: ${{ steps.annotate.outputs.digest }}
  created:
    description: Creation time annotated on the image, the commit time
    value: ${{ steps.annotate.outputs.created }}

runs:
  using: composite
  steps:
    - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
      with:
        go-version-file: go.mod
        cache: false
    - name: Fast gate and integration
      shell: bash
      run: |
        set -euo pipefail
        scripts/test.sh fast
        scripts/test.sh integration
    - name: Fetch oras
      shell: bash
      run: |
        set -euo pipefail
        mkdir "$RUNNER_TEMP/oras"
        cd "$RUNNER_TEMP/oras"
        curl -fsSLo oras.tar.gz "$ORAS_URL"
        echo "$ORAS_ARCHIVE_SHA256  oras.tar.gz" | sha256sum -c -
        tar -xzf oras.tar.gz oras
        echo "$ORAS_SHA256  oras" | sha256sum -c -
    - name: Build the image
      id: annotate
      shell: bash
      env:
        ORAS: ${{ runner.temp }}/oras/oras
      run: |
        set -euo pipefail
        created="$(TZ=UTC0 git log -1 --format=%cd --date=format-local:%Y-%m-%dT%H:%M:%SZ "$GITHUB_SHA")"
        scripts/image.sh build "$RUNNER_TEMP/image-build" "$GITHUB_SHA" "$created"
        digest="$(scripts/image.sh push "$RUNNER_TEMP/image-build" "$GITHUB_SHA" "$created" \
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
          "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT" \
          --oci-layout "$RUNNER_TEMP/image")"
        echo "digest=$digest" >> "$GITHUB_OUTPUT"
        echo "created=$created" >> "$GITHUB_OUTPUT"
        echo "Built image $digest"
    - name: Qualify the image
      shell: bash
      env:
        CLIPROXY_QUALIFICATION_LAYOUT: ${{ runner.temp }}/image
        CLIPROXY_QUALIFICATION_REVISION: ${{ github.sha }}
      run: scripts/test.sh qualification -v ./test/qualification
